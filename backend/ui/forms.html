<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Research decision form</title><link rel="stylesheet" href="./styles.css"></head>
<body data-surface="cards">
  <main class="inline-wrap" id="main">
    <article class="inline-card card-view" data-card="choice">
      <div class="card-body"><div class="card-header"><div><p class="eyebrow">Scientific choice</p><h1>Which analysis population should govern Table 1?</h1></div><span class="badge danger">Blocks revision</span></div><p class="muted">Choose one option. The decision will be recorded with its evidence and consequence.</p><div class="choice-stack" role="group" aria-label="Analysis population">
        <button class="choice-button" type="button" data-choice="intention-to-treat" aria-pressed="false"><span class="choice-key">A</span><span><strong>Intention-to-treat · n=1,284</strong><br><span class="muted">All randomized participants; matches the protocol estimand.</span></span><span>›</span></button>
        <button class="choice-button" type="button" data-choice="complete-case" aria-pressed="false"><span class="choice-key">B</span><span><strong>Complete-case · n=1,279</strong><br><span class="muted">Matches model 3 output and current table group counts.</span></span><span>›</span></button>
        <button class="choice-button" type="button" data-choice="clarification" aria-pressed="false"><span class="choice-key">C</span><span><strong>Ask the statistician</strong><br><span class="muted">Keep the revision blocked until the discrepancy is resolved.</span></span><span>›</span></button>
      </div><div class="field" id="choiceRationale" hidden><label for="choiceNote">Decision rationale</label><textarea id="choiceNote" placeholder="Required for a scientific choice"></textarea></div></div>
      <div class="card-footer"><button class="button primary" id="confirmChoice" disabled>Record selection</button><button class="button ghost" data-message="Summarize the evidence relevant to choosing the analysis population, without making the decision for me.">Compare evidence in chat</button></div>
    </article>
  </main>
  <div class="toast-region" id="toasts" aria-live="polite"></div><script type="module" src="./ui.js"></script>
</body></html>
